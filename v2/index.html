<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Precificação v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/v2.css">
</head>
<body class="v2">
<main class="v2-pagina">
  <header class="v2-topo">
    <div><h1 id="titulo">Precificação &mdash; versão 2</h1>
      <p class="sub" id="subtitulo">Em construção. A versão atual continua sendo a oficial.</p></div>
    <span class="grow"></span>
    <a class="btn small" id="lnkMigrar" href="migrar.html" hidden>Migração</a>
    <button class="btn small" id="btnTrocar" type="button" hidden>Trocar de empresa</button>
    <span class="muted" id="quem"></span>
    <button class="btn small" id="btnSair" type="button" hidden>Sair</button>
  </header>

  <section id="telaLogin" class="card v2-login" hidden>
    <h2>Entrar</h2>
    <form id="formLogin">
      <div class="field textrow"><label>E-mail</label><input type="email" id="email" autocomplete="username" required></div>
      <div class="field textrow"><label>Senha</label><input type="password" id="senha" autocomplete="current-password" required></div>
      <p class="neg" id="erroLogin"></p>
      <div class="form-actions">
        <button class="btn primary" type="submit">Entrar</button>
        <button class="btn" type="button" id="btnEsqueci">Esqueci a senha</button>
      </div>
    </form>
  </section>

  <section id="telaEmpresas" hidden>
    <div class="form-actions" style="margin:0 0 12px;" id="acoesAdmin" hidden>
      <button class="btn" id="btnNovaEmpresa" type="button">Nova empresa</button>
    </div>
    <div class="v2-empresas" id="listaEmpresas"></div>
  </section>

  <section id="telaProdutos" hidden>
    <div class="v2-aviso">Somente leitura por enquanto: os preços são calculados pelo mesmo motor da versão 1. A edição chega nas próximas etapas.</div>
    <div class="metrics" id="metricas"></div>
    <div class="card flat"><div class="tablewrap" id="tabela"></div></div>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
