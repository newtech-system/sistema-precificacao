<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mercado Livre &mdash; retorno da autorização</title>
<!--
  Página de retorno da autorização do Mercado Livre, uma só para todos os clientes.

  Por que ela existe: o Mercado Livre exige que a URL de retorno seja EXATAMENTE uma das cadastradas
  na aplicação, e cada cliente tem a própria planilha, com o próprio endereço de Apps Script. Em vez
  de cadastrar o endereço de cada cliente na aplicação, cadastra-se este endereço aqui uma única vez;
  ele recebe a autorização e encaminha para a planilha de quem começou o processo.

  O sistema manda, no parâmetro "state", o endereço da planilha que pediu a autorização. Esta página
  só encaminha para endereços de Apps Script do Google (https://script.google.com/macros/s/.../exec):
  assim ela não pode ser usada como trampolim para mandar ninguém a um site qualquer.

  Nada aqui guarda nem lê dados: o código de autorização só passa de volta para a planilha do
  cliente, que é quem tem a chave secreta para trocá-lo por um acesso.
-->
<style>
  :root{color-scheme:light dark;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;
    min-height:100vh;display:grid;place-items:center;background:#f4f4f5;color:#1c1c1e;padding:24px;}
  @media (prefers-color-scheme: dark){ body{background:#141416;color:#ececed;} .cartao{background:#1d1d20;border-color:#2e2e33;} }
  .cartao{background:#fff;border:1px solid #e3e3e6;border-radius:14px;padding:28px 30px;max-width:620px;width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.07);}
  h1{font-size:19px;margin:0 0 10px;}
  p{font-size:14.5px;line-height:1.55;margin:0 0 12px;}
  .ok{color:#1b7f4d;} .erro{color:#b3261e;}
  code{font-size:12.5px;background:rgba(127,127,127,.14);padding:2px 6px;border-radius:5px;word-break:break-all;}
  .peq{font-size:12.5px;opacity:.8;}
</style>
</head>
<body>
<div class="cartao">
  <h1 id="titulo">Mercado Livre</h1>
  <div id="corpo"><p>Processando a autorização...</p></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var titulo = document.getElementById('titulo');
  var corpo = document.getElementById('corpo');
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  function mostra(cor, t, html){ titulo.className = cor; titulo.textContent = t; corpo.innerHTML = html; }

  if(q.get('error')){
    mostra('erro', 'O Mercado Livre recusou a autorização',
      '<p>Motivo: <b>' + esc(q.get('error')) + '</b><br>' + esc(q.get('error_description') || '') + '</p>' +
      '<p class="peq">Quase sempre é a URL de retorno: ela precisa estar cadastrada na aplicação exatamente como o sistema mostra.</p>');
    return;
  }

  var code = q.get('code');
  var destino = q.get('state') || '';
  if(!code){
    mostra('erro', 'Endereço aberto direto',
      '<p>Esta página só serve como retorno da autorização do Mercado Livre. Abra a aba <b>Mercado Livre</b> do sistema e clique em <b>Conectar</b>.</p>');
    return;
  }
  // só encaminha para um Apps Script do Google publicado: nunca para um endereço qualquer
  var permitido = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(destino);
  if(!permitido){
    mostra('erro', 'Não sei para qual planilha devolver',
      '<p>A autorização voltou sem o endereço da planilha, ou com um endereço que não é um Apps Script publicado.</p>' +
      (destino ? '<p class="peq">Veio: <code>' + esc(destino) + '</code></p>' : '') +
      '<p class="peq">Na tela Mercado Livre do sistema, confira o campo "URL de retorno" e tente conectar de novo.</p>');
    return;
  }
  var url = destino + '?code=' + encodeURIComponent(code);
  mostra('ok', 'Autorizado, finalizando...',
    '<p>Entregando a autorização para a sua planilha. Se nada acontecer em alguns segundos, ' +
    '<a href="' + esc(url) + '">clique aqui</a>.</p>');
  location.replace(url);
})();
</script>
</body>
</html>
